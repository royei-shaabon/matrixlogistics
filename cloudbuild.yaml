steps:
  # Build Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=get-supply.web.app
      - --build-arg
      - NEXT_PUBLIC_APP_URL=https://get-supply.web.app
      - -t
      - "me-west1-docker.pkg.dev/$PROJECT_ID/matrix-supply/app:$_ENV"
      - .

  # Push to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "me-west1-docker.pkg.dev/$PROJECT_ID/matrix-supply/app:$_ENV"

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "get-supply-$_ENV"
      - "--image=me-west1-docker.pkg.dev/$PROJECT_ID/matrix-supply/app:$_ENV"
      - "--platform=managed"
      - "--region=me-west1"
      - "--allow-unauthenticated"
      - "--set-secrets=JWT_SECRET=jwt-secret-$_ENV:latest,GOOGLE_CLIENT_SECRET=google-oauth-secret:latest"
      - "--set-env-vars=NODE_ENV=production,NEXT_PUBLIC_APP_URL=https://get-supply.web.app,APP_URL=https://get-supply.web.app,GOOGLE_CLIENT_ID=47448375492-gc1m0odh1re60h9e5bf5ug28keq8ta6t.apps.googleusercontent.com,SUPER_ADMIN_EMAIL=shaabon.royei@gmail.com"
      - "--min-instances=0"
      - "--memory=512Mi"

  # Deploy Firebase Hosting rewrites (must run after Cloud Run to point to latest revision)
  - name: "node:20-alpine"
    entrypoint: sh
    args:
      - -c
      - "npm install -g firebase-tools && firebase deploy --only hosting --project $PROJECT_ID --non-interactive"

images:
  - "me-west1-docker.pkg.dev/$PROJECT_ID/matrix-supply/app:$_ENV"

substitutions:
  _ENV: prod  # overridden per trigger (prod / dev)

options:
  logging: CLOUD_LOGGING_ONLY
